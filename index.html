<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frufru Project</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at top,#171717,#020202);

color:white;

}



/* ESTRELAS */

.stars{

position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;

}



.star{

position:absolute;

background:white;

border-radius:50%;

opacity:.7;

animation:
move linear infinite,
brilho 2s infinite alternate;

}



@keyframes move{

to{

transform:translate(100px,120vh);

}

}



@keyframes brilho{

from{

opacity:.2;

}

to{

opacity:1;

}

}



/* HEADER */


header{

height:85px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 70px;

backdrop-filter:blur(15px);

}



.logo img{

width:45px;

height:45px;

object-fit:contain;

}



nav{

display:flex;

gap:35px;

}



nav a{

color:#999;

cursor:pointer;

transition:.3s;

}



nav a:hover{

color:white;

transform:translateY(-3px);

}



.try{

background:white;

color:black;

border:none;

padding:14px 30px;

border-radius:40px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}



.try:hover{

transform:scale(1.1);

box-shadow:0 0 30px white;

}




/* PAGINAS */


main{

height:calc(100vh - 85px);

display:flex;

justify-content:center;

align-items:center;

text-align:center;

}



.page{

display:none;

animation:entrada .5s;

}



.active{

display:block;

}



@keyframes entrada{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:none;

}

}



/* IMAGENS DOS CANTOS */


.extra-images{

position:absolute;

top:50%;

left:0;

right:0;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 70px;

transform:translateY(-50%);

opacity:0;

animation:aparecer .8s forwards;

}



@keyframes aparecer{

to{

opacity:1;

}

}



.extra-images img{

width:260px;

height:260px;

object-fit:cover;

border-radius:35px;

border:1px solid #333;

transition:.5s;

filter:drop-shadow(0 0 30px black);

}



.extra-images img:hover{

transform:scale(1.1);

box-shadow:0 0 40px white;

}

  



/* LOGO CENTRAL */


.logo-big img{

width:240px;

height:240px;

object-fit:contain;

filter:drop-shadow(0 0 50px white);

transition:.4s;

}



.logo-big img:hover{

transform:scale(1.1) rotate(5deg);

}




h1{

font-size:80px;

letter-spacing:-4px;

}



h1 span{

background:linear-gradient(white,#666);

-webkit-background-clip:text;

color:transparent;

}




p{

max-width:650px;

margin:25px auto;

font-size:20px;

color:#aaa;

}





/* CARD SOBRE */


.card{

background:#111;

border:1px solid #333;

padding:40px;

border-radius:30px;

width:500px;

}




.card h2{

font-size:45px;

}





.sobre-img img{

width:180px;

height:180px;

object-fit:cover;

border-radius:30px;

border:1px solid #333;

margin-bottom:25px;

}





/* CELULAR */


@media(max-width:900px){


.extra-images{

padding:0 15px;

}



.extra-images img{

width:100px;

height:100px;

border-radius:20px;

}



.logo-big img{

width:160px;

height:160px;

}



h1{

font-size:45px;

}



p{

font-size:16px;

padding:0 20px;

}



header{

padding:0 20px;

}



nav{

gap:15px;

}



.try{

padding:10px 15px;

}



.card{

width:90%;

}



}






</style>

</head>



<body>



<div class="stars"></div>



<header>


<div class="logo">

<img src="logo.png">

</div>




<nav>

<a onclick="page('home')">Inicio</a>

<a onclick="page('sobre')">Sobre</a>

</nav>




<button class="try" onclick="discord()">

Entrar no Discord ↗

</button>



</header>





<main>





<section id="home" class="page active">



<div class="extra-images">


<img src="imagem1.png">



<img src="imagem2.png">



</div>





<div class="logo-big">

<img src="logo.png">

</div>





<h1>

EM BREVE.<br>

<span>Frufru Project.</span>

</h1>





<p>

Scripts inovadores para Roblox, feitos para desempenho e praticidade.

</p>




</section>

  



<section id="sobre" class="page">



<div class="card">



<div class="sobre-img">

<img src="imagem3.png">

</div>




<h2>

Sobre

</h2>




<p>

Quem não xita, não brilha.

<br><br>

Developers:

<br>

0xdead • 6cbv • alwayshighx

</p>




</div>



</section>





</main>







<script>



// ESTRELAS


let stars=document.querySelector(".stars");



for(let i=0;i<150;i++){


let s=document.createElement("div");


s.className="star";



let size=Math.random()*4+1;



s.style.width=size+"px";


s.style.height=size+"px";



s.style.left=Math.random()*100+"%";


s.style.top=Math.random()*100+"%";



s.style.animationDuration=

(5+Math.random()*15)+"s";



stars.appendChild(s);



}







function page(id){



document.querySelectorAll(".page")

.forEach(x=>x.classList.remove("active"));



document.getElementById(id)

.classList.add("active");



}








function discord(){



window.open(

"SEU_LINK_DO_DISCORD",

"_blank"

);



}



</script>





</body>

</html>
