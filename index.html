<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Projeto</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 100px;
}

.caixa {
    background: #222;
    width: 350px;
    margin: auto;
    padding: 30px;
    border-radius: 15px;
}

button {
    background: #5865f2;
    color: white;
    border: 0;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    opacity: 0.8;
}

#resultado {
    margin-top: 20px;
}
</style>

</head>

<body>

<div class="caixa">

<h1>Meu Projeto</h1>

<p>Status:</p>

<button onclick="verificar()">Verificar</button>

<div id="resultado"></div>

</div>


<script>

function verificar(){

    document.getElementById("resultado").innerHTML =
    "Servidor respondendo...";

}

</script>


</body>
</html>
